<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bid House</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><span class="eyebrow">LIVE MARKET</span><h1 id="houseTitle">Bid House</h1><span id="houseFee" class="muted"></span></div><div class="header-status"><button id="browse" class="link-button">Browse houses</button><span id="season"></span><span id="connection" class="status">Connecting…</span></div></header>
<main id="accountView" class="join"><form id="accountForm"><h2 id="accountTitle">Log in</h2><label>Username<input id="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" required></label><label>Password<input id="password" type="password" minlength="8" maxlength="128" required></label><button id="accountSubmit">Log in</button><button id="accountToggle" class="link-button" type="button">Need an account? Register</button></form></main>
<main id="houseView" class="browser hidden"><div class="panel-title"><div><h2>Choose a house</h2><p class="muted">Deploy a character to take part. Your wallet and collection travel with you.</p></div><button id="closeBrowser">Return</button></div><div id="deployments" class="deployments"></div><div id="houses" class="house-grid"></div></main>
<dialog id="characterDialog"><form method="dialog"><h2>Deploy a character</h2><label>Character<select id="character"></select></label><p id="characterDetail" class="muted"></p><div class="row"><button value="cancel">Cancel</button><button id="confirmDeploy" value="default" class="accent">Deploy</button></div></form></dialog>
<main id="gameView" class="grid hidden"><section><div class="panel-title"><h2>Your cabinet</h2><span id="wallet"></span></div><div id="identity" class="identity"></div><div id="abilities" class="abilities"></div><div id="inventory" class="stack"></div></section><section><div class="panel-title"><h2>Live auctions</h2><span class="live">● LIVE</span></div><div id="auctions" class="stack"></div></section><section><div class="panel-title"><h2>Orders board</h2><button id="openBox" class="accent">Open box</button></div><div id="orders" class="stack"></div></section></main>
<div id="toasts" aria-live="polite"></div><script type="module" src="client.js"></script></body></html>
