<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bid House</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div><span class="eyebrow">LIVE MARKET</span><h1>Bid House</h1></div><div class="header-status"><span id="season"></span><span id="connection" class="status">Connecting…</span></div></header>
<main id="accountView" class="join"><form id="accountForm"><h2 id="accountTitle">Log in</h2><label>Username<input id="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" required placeholder="market_maven"></label><label>Password<input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button id="accountSubmit">Log in</button><button id="accountToggle" class="link-button" type="button">Need an account? Register</button></form></main>
<main id="characterView" class="join hidden"><form id="characterForm"><h2>Choose your bidder</h2><label>Character<select id="character"></select></label><p id="characterDetail" class="muted"></p><button>Take your seat</button></form></main>
<main id="gameView" class="grid hidden"><section><div class="panel-title"><h2>Your cabinet</h2><span id="wallet"></span></div><div id="identity" class="identity"></div><div id="abilities" class="abilities"></div><div id="inventory" class="stack"></div></section><section><div class="panel-title"><h2>Live auctions</h2><span class="live">● LIVE</span></div><div id="auctions" class="stack"></div></section><section><div class="panel-title"><h2>Orders board</h2><button id="openBox" class="accent">Open box</button></div><p class="muted">Two starter boxes are free. Later boxes cost 100 coins.</p><div id="orders" class="stack"></div></section></main>
<div id="toasts" aria-live="polite"></div><script type="module" src="client.js"></script></body></html>
